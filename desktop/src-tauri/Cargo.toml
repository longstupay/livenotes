[package]
name = "livenotes-desktop"
version = "0.1.0"
description = "LiveNotes desktop shell (Tauri 2)"
authors = ["LiveNotes"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"
default-run = "livenotes-desktop"

[lib]
name = "livenotes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2.12.5", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# 诊断包：只开 deflate，避免把 bzip2/zstd/aes 整条依赖树拖进壳。
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
