<!doctype html>
<html lang="zh-CN" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标注模式 · 壳测试台</title>
<style>
  /* 只在测试台里出现的直播页 mock：生产里这块是原生 WebView2 子视图。 */
  .demo-live{position:absolute;inset:0;overflow:hidden;color:#e9e6df;
    background:
      radial-gradient(120% 95% at 22% 12%,rgba(74,50,134,.52),transparent 55%),
      radial-gradient(100% 90% at 82% 88%,rgba(24,58,114,.48),transparent 60%),
      linear-gradient(145deg,#151128 0%,#0B1020 48%,#071019 100%);
    font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
  .demo-live .dl-top{display:flex;align-items:center;gap:9px;padding:12px 14px;position:relative;z-index:2}
  .demo-live .dl-av{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#d8c4ff,#7e5bd0);
    color:#1b1330;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .demo-live .dl-name{font-size:12px;font-weight:600;display:flex;flex-direction:column;line-height:1.3}
  .demo-live .dl-name small{font-size:9px;color:rgba(230,234,242,.55);font-weight:400}
  .demo-live .dl-follow{font-size:9px;color:#ffd9a8;border:1px solid rgba(255,200,140,.35);
    background:rgba(255,190,120,.12);border-radius:5px;padding:2px 7px}
  .demo-live .dl-live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:9px;color:#ffb4ad}
  .demo-live .dl-live i{width:5px;height:5px;border-radius:50%;background:#ff6b62}
  .demo-live .dl-stage{position:relative;z-index:2;display:flex;justify-content:center;gap:22px;
    padding:10px 168px 0 18px;height:230px}
  .demo-live .dl-tile{width:118px;height:150px;border-radius:11px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;background:rgba(10,14,24,.42);
    border:1px solid rgba(255,255,255,.08)}
  .demo-live .dl-tile.host{width:134px;height:168px;border-color:rgba(230,181,102,.35);
    background:linear-gradient(160deg,rgba(230,181,102,.10),rgba(10,14,24,.45))}
  .demo-live .dl-face{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:18px;font-weight:800;color:#171225}
  .demo-live .dl-face.a{background:linear-gradient(145deg,#f0d9a8,#c9934c)}
  .demo-live .dl-face.b{background:linear-gradient(145deg,#d9c7f4,#8b6ac4)}
  .demo-live .dl-tn{font-size:10px;font-weight:600}
  .demo-live .dl-tr{font-size:8px;color:rgba(230,234,242,.5)}
  .demo-live .dl-chat{position:absolute;right:12px;top:58px;bottom:52px;width:144px;z-index:3;
    background:rgba(6,9,15,.62);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:9px;overflow:hidden}
  .demo-live .dl-chat h4{margin:0 0 7px;font-size:8.5px;color:rgba(230,234,242,.55);font-weight:500}
  .demo-live .dl-chat h4 b{color:#d9c7f4}
  .demo-live .dl-msg{font-size:8.5px;line-height:1.6;color:rgba(230,234,242,.66);margin-bottom:6px}
  .demo-live .dl-msg b{color:#f2c98a;font-weight:500}
  .demo-live .dl-msg em{font-style:normal;color:#9fd9c1}
  .demo-live .dl-panel{position:absolute;left:18px;right:168px;bottom:52px;z-index:2;
    background:rgba(8,11,18,.52);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:10px 11px}
  .demo-live .dl-ph{font-size:8.5px;color:rgba(230,234,242,.5);letter-spacing:.5px;margin-bottom:6px}
  .demo-live .dl-pi{display:flex;align-items:center;gap:7px;font-size:9.5px;color:rgba(230,234,242,.72);margin:5px 0}
  .demo-live .dl-pi i{width:14px;height:14px;border-radius:4px;background:rgba(230,181,102,.12);
    border:1px solid rgba(230,181,102,.22);color:#E6B566;font-size:7.5px;font-style:normal;
    display:flex;align-items:center;justify-content:center;font-family:monospace}
  .demo-live .dl-input{position:absolute;left:16px;right:168px;bottom:13px;height:28px;border-radius:8px;
    background:rgba(8,11,18,.72);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;
    padding:0 10px;font-size:9px;color:rgba(230,234,242,.38)}
  #harnessResult{display:none}
  #harnessResult.on{display:block;position:fixed;left:70px;bottom:34px;z-index:999;max-width:900px;
    background:#11161d;border:1px solid #2a3440;border-radius:8px;padding:10px 12px;color:#e9e6df;
    font:11px/1.5 monospace;white-space:pre-wrap;max-height:50vh;overflow:auto}
</style>
</head>
<body>
<div id="harnessResult"></div>
<script>
/* ================================================================ mock API
   这个文件只用来在普通 Chrome 里验壳，不参与生产打包。
   - 没有 Tauri：给一个假的 __TAURI__，让 room_open 这类 IPC 返回成功；
   - 没有引擎：fetch 全量走内存 DB，POST 会真的改内存，界面能走完整链路。 */
const DB = {
  rooms: [
    { id: 'rmtest01', seq: 1, url: 'https://live.douyin.com/123456789013',
      resolved_url: '', name: '示例科技 · 企业AI落地', state: 'live',
      session_id: 'LIVE_TEST', capture_engine: 'direct' },
  ],
  speakers: [
    { speaker_id: 'SPK_00', label: '主播 小A', seconds: 620, count: 42,
      manual: true, person_state: 'confirmed', person_name: '主播 小A', person_score: null },
    { speaker_id: 'SPK_01', label: '老王', seconds: 120, count: 8,
      manual: false, person_state: 'cand', person_name: '老王', person_score: 0.42 },
    { speaker_id: 'SPK_02', label: 'SPK_02', seconds: 65, count: 4,
      manual: false, person_state: '', person_name: '', person_score: null },
    { speaker_id: 'SPK_03', label: 'SPK_03', seconds: 160, count: 9,
      manual: false, person_state: '', person_name: '', person_score: null },
  ],
  utts: [
    [0, 700, 'SPK_00', '所以说我们现在还是需要把落地的项目先跑起来，不然光讲方法没有用。'],
    [1, 704, 'SPK_00', '这两天我也把手里面的项目整理一下，然后我们再来对一下节奏。'],
    [2, 705, 'SPK_01', '我这两天也把手里面的项目整理一下，之后咱们再碰一次。'],
    [3, 709, 'SPK_03', '喂，能听到吗？我这边刚进来，刚才说到哪儿了？'],
    [4, 710, 'SPK_00', '能听到，王总你来得正好，我们刚说到项目落地这块。'],
    [5, 712, 'SPK_02', '对，我觉得这个部分可以拆成两个阶段来做。'],
    [6, 713, 'SPK_00', '可以，那我们先看第一阶段，也就是把现有的场次跑通。'],
    [7, 714, 'SPK_03', '成本这块我比较关心，现在一套跑下来大概多少？'],
    [8, 716, 'SPK_00', '先别急着算总数，把音频质量 and 标注这两件事做稳，成本才降得下来。'],
    [9, 718, 'SPK_01', '同意，尤其是说话人标注，不然后面按人复盘没法做。'],
    [10, 720, 'SPK_02', '我这边可以先拿一个项目试一下，跑两周看看数据。'],
    [11, 722, 'SPK_00', '行，那我们下周把这个试点定下来。'],
  ].map((x, i) => ({
    id: i + 1, t_start: x[1], t_end: x[1] + 4, speaker_id: x[2],
    speaker_label: '', text: x[3], value_tag: i === 4 ? 'high' : 'normal',
  })),
};
function speakerOf(id) { return DB.speakers.find((s) => s.speaker_id === id) || null; }
function relabelUtterances(spk, label) {
  DB.utts.forEach((u) => { if (u.speaker_id === spk) u.speaker_label = label; });
}
DB.speakers.forEach((s) => relabelUtterances(s.speaker_id, s.label));

const CALLS = [];
window.__CALLS__ = CALLS;
window.__TAURI__ = {
  core: { invoke: async (cmd, args) => { CALLS.push({ cmd, args }); return null; } },
};
window.__LN_ENGINE__ = location.origin;

function json(data, status) {
  return new Response(JSON.stringify(data), {
    status: status || 200, headers: { 'Content-Type': 'application/json' },
  });
}
function liveSession() {
  return {
    id: 'LIVE_TEST', title: '企划测试', elapsed: 725, running: true, paused: false,
    n_utterances: 179, last_final_ago_s: 0.8, last_chunk_ago_s: 0.1,
    dropped: 0, queued: 0, speakers: DB.speakers, utterances: DB.utts,
    partial: { t_start: 723, text: '那这个成本大概…' },
    last_line: '行，那我们下周把这个试点定下来。',
  };
}

const realFetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const u = new URL(url, location.href);
  const p = u.pathname;
  if (!p.startsWith('/api/')) return realFetch(url, opts);
  const method = ((opts && opts.method) || 'GET').toUpperCase();
  let body = {};
  try { body = opts && opts.body ? JSON.parse(opts.body) : {}; } catch (e) {}
  if (method === 'POST') CALLS.push({ path: p, body });
  if (p === '/api/rooms') return json({ rooms: DB.rooms });
  if (p === '/api/live/list') return json({ sessions: [liveSession()] });
  if (p === '/api/health') return json({ ok: true });
  if (p === '/api/sessions') return json({ sessions: [] });
  if (p === '/api/library') return json({ stats: { trash: 0 } });
  if (p === '/api/settings') return json({ prefs: { close_action: 'tray' } });
  if (p === '/api/live/status') return json(liveSession());
  if (p === '/api/speakers' && method === 'GET') {
    return json({ speakers: DB.speakers });
  }
  if (p === '/api/utterances' && method === 'GET') return json({ rows: DB.utts, total: DB.utts.length });
  if (p === '/api/persons/enroll') {
    const s = speakerOf(body.speaker_id);
    if (s) {
      s.label = body.name; s.manual = true; s.person_state = 'confirmed'; s.person_name = body.name;
      relabelUtterances(s.speaker_id, body.name);
    }
    return json({ ok: true, added: 2, person_id: 'p_test', name: body.name });
  }
  if (p === '/api/speakers/rename') {
    const s = speakerOf(body.speaker_id);
    if (s) { s.label = body.name; s.manual = true; relabelUtterances(s.speaker_id, body.name); }
    return json({ ok: true });
  }
  if (p === '/api/speakers/merge') {
    const t = speakerOf(body.target_id);
    const srcs = body.src_ids || [];
    srcs.forEach((src) => {
      const s = speakerOf(src);
      if (s && t) { t.seconds += s.seconds; t.count += s.count; }
      DB.utts.forEach((u) => {
        if (u.speaker_id === src) { u.speaker_id = body.target_id; u.speaker_label = t ? t.label : body.target_label; }
      });
      DB.speakers = DB.speakers.filter((x) => x.speaker_id !== src);
    });
    return json({ ok: true, merged: srcs.length });
  }
  if (p === '/api/live/reject_hint') {
    const s = speakerOf(body.speaker_id);
    if (s) {
      s.person_state = 'rejected'; s.manual = false; s.person_name = ''; s.person_score = null;
      s.label = '说话人';
    }
    return json({ ok: true });
  }
  if (p === '/api/live/mark' || p === '/api/live/pause') return json({ ok: true });
  if (p === '/api/utterances/reassign' || p === '/api/utterances/update') return json({ ok: true });
  return json({});
};

/* ================================================================ load shell */
async function loadShell() {
  const html = await (await fetch('/desktop/dist/shell.html')).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script[src="/shell.js"]').forEach((s) => s.remove());
  document.documentElement.dataset.theme = 'studio';
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = '/desktop/dist/shell.css';
  document.head.appendChild(link);
  document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);

  // 页面左栏放一个测试用直播页，模拟生产里的原生子视图。
  const page = document.getElementById('annotPage');
  const empty = document.getElementById('annotPageEmpty');
  if (empty) empty.remove();
  page.insertAdjacentHTML('beforeend',
    '<div class="demo-live">' +
      '<div class="dl-top"><span class="dl-av">示</span>' +
        '<span class="dl-name">示例科技 · 企业AI落地<small>3721 本场点赞</small></span>' +
        '<span class="dl-follow">关注</span><span class="dl-live"><i></i>直播中</span></div>' +
      '<div class="dl-stage">' +
        '<div class="dl-tile host"><div class="dl-face a">示</div><div class="dl-tn">示例科技 小A</div><div class="dl-tr">主播</div></div>' +
        '<div class="dl-tile"><div class="dl-face b">王</div><div class="dl-tn">老王</div><div class="dl-tr">连麦嘉宾</div></div>' +
      '</div>' +
      '<div class="dl-chat"><h4><b>实时聊天</b> · 50 人在线</h4>' +
        '<div class="dl-msg"><b>知玉：</b>欢迎王总，今天讲点干货</div>' +
        '<div class="dl-msg"><em>老王：</em>我先把手里项目整理一下</div>' +
        '<div class="dl-msg"><b>易流AI：</b>这段落地的部分能再讲细一点吗</div>' +
        '<div class="dl-msg"><b>知玉：</b>主播把刚才那句再说一遍</div>' +
        '<div class="dl-msg"><em>运营小周：</em>大家点点关注，福袋马上开</div>' +
        '<div class="dl-msg"><b>知玉：</b>王总来了，欢迎欢迎</div></div>' +
      '<div class="dl-panel"><div class="dl-ph">本场讲解 · 项目落地</div>' +
        '<div class="dl-pi"><i>1</i>现有场次跑通，先拿到可复盘的数据</div>' +
        '<div class="dl-pi"><i>2</i>音频质量与说话人标注，决定总结能不能用</div>' +
        '<div class="dl-pi"><i>3</i>按人复盘、导出，再回到下一场</div></div>' +
      '<div class="dl-input">说点什么…</div></div>');

  const s = document.createElement('script');
  s.src = '/desktop/dist/shell.js';
  s.onload = () => setTimeout(runMode, 600);
  document.body.appendChild(s);
}

function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }
function q(sel) { return document.querySelector(sel); }
function qa(sel) { return Array.from(document.querySelectorAll(sel)); }

async function runMode() {
  const params = new URLSearchParams(location.search);
  if (!window.__LN_SHELL__) return;
  await window.__LN_SHELL__.annotate();
  await wait(500);

  if (params.get('shot') === '1') {
    // 打开一个说话人弹层，给截图用；不写库。
    const chip = q('.spk[data-spk-id="SPK_03"]');
    if (chip) chip.click();
    await wait(200);
    return;
  }
  if (params.get('auto') !== '1') return;

  const out = { steps: [] };
  const step = (name, data) => out.steps.push({ name, data });
  step('initial', window.__LN_SHELL__.state());
  step('chips', qa('.spk[data-spk-id]').length);
  step('cards', qa('.snd').length);
  step('banner', (q('#txBanner') || {}).textContent || '');
  step('progress', (q('.pstat') || {}).textContent || '');
  step('annotRect', (() => {
    const r = q('#annotPage').getBoundingClientRect();
    return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) };
  })());
  step('roomOpen', CALLS.find((c) => c.cmd === 'room_open') || null);

  // 1) 待认领弹层 + 新建人物
  q('.spk[data-spk-id="SPK_02"]').click();
  await wait(150);
  step('popOpen', !q('#spkPop').hidden && qa('#spkPop .pi').length);
  q('#spkPop [data-new]').click();
  await wait(150);
  q('#spkName').value = '阿哲';
  q('#spkNameOk').click();
  await wait(500);
  step('afterEnroll', window.__LN_SHELL__.state());
  step('enrollCall', CALLS.find((c) => c.path === '/api/persons/enroll') || null);

  // 2) 把 SPK_03 只标角色
  const chip3 = q('.spk[data-spk-id="SPK_03"]');
  chip3.click();
  await wait(120);
  q('#spkPop [data-role="嘉宾"]').click();
  await wait(450);
  step('afterRole', window.__LN_SHELL__.state());
  step('roleCard', (qa('.snd').find((el) => /嘉宾/.test(el.textContent)) || {}).textContent || '');

  // 3) 确认声纹候选老王
  const confirmBtn = qa('.snd-acts [data-spk-act="confirm"]')[0];
  if (confirmBtn) confirmBtn.click();
  await wait(450);
  step('afterConfirm', window.__LN_SHELL__.state());

  // 4) 把 SPK_03 并进主播：两个都有身份，先出确认弹层
  const targetChip = q('.spk[data-spk-id="SPK_03"]');
  if (targetChip) {
    targetChip.click();
    await wait(120);
    const t = q('#spkPop [data-target="SPK_00"]');
    if (t) t.click();
    await wait(200);
  }
  step('mergeAsk', !!(q('[data-mconfirm="merge"]')));
  const mergeOk = q('[data-mconfirm="merge"]');
  if (mergeOk) mergeOk.click();
  await wait(450);
  step('afterMerge', window.__LN_SHELL__.state());
  step('mergeCall', CALLS.find((c) => c.path === '/api/speakers/merge') || null);

  // 5) 面板：放大字幕时原生视图必须收起；还原后重新显示并按新矩形布局。
  const maxTx = q('.apane-btn[data-pane-act="max"][data-pane="tx"]');
  const callIdx = CALLS.length;
  if (maxTx) maxTx.click();
  await wait(400);
  const hideCall = CALLS.slice(callIdx).find((c) => c.cmd === 'room_show' && c.args.visible === false);
  step('maxTx', { hidden: !!hideCall });
  if (maxTx) maxTx.click();
  await wait(400);
  const showCall = CALLS.slice(callIdx).find((c) => c.cmd === 'room_show' && c.args.visible === true);
  const relayout = CALLS.slice(callIdx).filter((c) => c.cmd === 'room_layout').pop();
  step('restoreTx', { shown: !!showCall, relayout: relayout ? relayout.args : null });

  out.calls = CALLS.filter((c) => c.path);
  // 原生视图的矩形必须和「直播页面」面板一致；上下分栏后它不再是窄左栏，
  // 所以断言两者对齐，而不是写死某个宽度。
  const rect = out.steps.find((s) => s.name === 'annotRect').data;
  const openCall = out.steps.find((s) => s.name === 'roomOpen').data;
  const aligned = !!openCall &&
    Math.abs(openCall.args.x - rect.x) <= 2 &&
    Math.abs(openCall.args.y - rect.y) <= 2 &&
    Math.abs(openCall.args.w - rect.w) <= 2 &&
    Math.abs(openCall.args.h - rect.h) <= 2;
  out.aligned = aligned;
  const maxTxStep = out.steps.find((s) => s.name === 'maxTx').data;
  const restoreTx = out.steps.find((s) => s.name === 'restoreTx').data;
  out.panes = { hidden: maxTxStep.hidden, shown: restoreTx.shown, relayout: !!restoreTx.relayout };
  out.ok = out.steps.find((s) => s.name === 'initial').data.speakers === 4 &&
    out.steps.find((s) => s.name === 'afterEnroll').data.claimed >= 3 &&
    out.steps.find((s) => s.name === 'afterMerge').data.speakers === 3 &&
    aligned && out.panes.hidden && out.panes.shown && out.panes.relayout;
  const box = q('#harnessResult');
  box.textContent = JSON.stringify(out, null, 2);
  box.classList.add('on');
  document.title = out.ok ? 'HARNESS-OK' : 'HARNESS-FAIL';
}
loadShell();
</script>
</body>
</html>
