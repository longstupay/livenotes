<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveNotes · 工作区原型 B</title>
<style>
/* ============================================================
   方案 B 设计原型 · 单窗口工作区
   仅用于交互/视觉评审，不是生产代码
   ============================================================ */
:root{
  --bg:#080A0D; --panel:#0D1116; --panel-2:#11161D; --panel-3:#151B23;
  --line:#1D252E; --line-2:#2A3440;
  --ink:#E9E6DF; --muted:#8B97A4; --faint:#5E6A77;
  --amber:#E6B566; --amber-soft:rgba(230,181,102,.12); --amber-line:rgba(230,181,102,.28);
  --jade:#84D6B2; --jade-soft:rgba(132,214,178,.10);
  --red:#E8776D; --red-soft:rgba(232,119,109,.10);
  --blue:#8FB4D9; --blue-soft:rgba(143,180,217,.10);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--ink); font:12.5px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input{outline:none}
::selection{background:rgba(230,181,102,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#242D38;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#303B48}
::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}
svg{display:block;flex:0 0 auto}
mark{background:rgba(230,181,102,.18);color:#F1D49B;border-radius:3px;padding:0 2px}
kbd{
  font-family:var(--mono);font-size:9.5px;color:var(--faint);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;background:#0B0F13;
}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ------------------------------------------------------------ shell */
.app{height:100vh;display:grid;grid-template-rows:44px minmax(0,1fr) 28px}
.body{display:grid;grid-template-columns:68px 288px minmax(0,1fr) 372px;min-height:0}
.body.no-inspector{grid-template-columns:68px 288px minmax(0,1fr) 0}

/* ------------------------------------------------------------ topbar */
.topbar{
  display:flex;align-items:center;gap:14px;padding:0 14px;
  background:#0A0D11;border-bottom:1px solid var(--line);position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mark{
  width:22px;height:22px;border-radius:6px;background:linear-gradient(145deg,#E9BE74,#C98F3B);
  display:flex;align-items:center;justify-content:center;color:#1A1306;
  box-shadow:0 0 0 1px rgba(230,181,102,.25),0 3px 10px rgba(230,181,102,.10);
}
.wordmark{font-size:13px;font-weight:650;letter-spacing:.2px}
.proto{
  font-size:9px;letter-spacing:.8px;color:var(--faint);border:1px solid var(--line-2);
  border-radius:4px;padding:0 5px;line-height:15px;margin-left:1px;
}
.crumb{font-size:11.5px;color:var(--faint);white-space:nowrap;display:flex;gap:6px;align-items:center}
.crumb b{font-weight:500;color:var(--muted)}
.crumb i{font-style:normal;color:#3A4652}
.cmdk{
  margin-left:auto;width:340px;height:30px;flex:0 1 340px;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:#0F1319;border:1px solid var(--line);border-radius:8px;color:var(--faint);
  transition:border-color .14s,background .14s;
}
.cmdk:hover{border-color:#33404E;background:#11161D;color:var(--muted)}
.cmdk span{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk kbd{margin-left:auto}
.top-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.rec-pill{
  height:28px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:7px;
  background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);
  font-size:11px;white-space:nowrap;
}
.rec-pill b{font-weight:650;font-variant-numeric:tabular-nums}
.rec-pill:hover{background:rgba(230,181,102,.17)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.dot.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 currentColor}50%{opacity:.55;box-shadow:0 0 0 4px transparent}}
.icon-btn{
  width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid transparent;
}
.icon-btn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line)}

/* ------------------------------------------------------------ rail */
.rail{
  background:#0A0D11;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:9px 0 8px;gap:2px;z-index:20;
}
.rail-item{
  width:54px;height:52px;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--faint);position:relative;
  transition:background .12s,color .12s;
}
.rail-item span{font-size:9.5px;letter-spacing:.2px}
.rail-item:hover{background:#10151B;color:var(--muted)}
.rail-item.on{background:var(--panel-2);color:var(--ink)}
.rail-item.on::before{
  content:"";position:absolute;left:2px;top:13px;bottom:13px;width:2px;
  background:var(--amber);border-radius:2px;
}
.rail-item .badge{
  position:absolute;top:6px;right:7px;min-width:14px;height:14px;padding:0 4px;
  border-radius:7px;background:var(--amber);color:#1A1306;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.rail-spacer{flex:1}

/* ------------------------------------------------------------ sidebar */
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.side-head{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px}
.side-head h1{font-size:12.5px;font-weight:600;margin:0;letter-spacing:.2px}
.side-head .count{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-head .spacer{flex:1}
.side-head .icon-btn{width:26px;height:26px}
.side-tools{height:34px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 10px 6px}
.chip{
  height:24px;padding:0 9px;border-radius:6px;border:1px solid transparent;
  color:var(--muted);font-size:10.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.chip:hover{background:#121820;color:var(--ink)}
.chip.on{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.chip .n{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on .n{color:var(--amber)}
.side-list{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px}
.group-label{
  font-size:9.5px;letter-spacing:.7px;color:var(--faint);padding:11px 7px 5px;
  display:flex;align-items:center;gap:6px;text-transform:uppercase;
}
.group-label .n{color:#4D5966;font-variant-numeric:tabular-nums}
.room{
  width:100%;text-align:left;padding:9px 10px 8px;border-radius:9px;border:1px solid transparent;
  display:flex;flex-direction:column;gap:5px;position:relative;margin:1px 0;
}
.room:hover{background:#11161D}
.room.on{background:var(--panel-2);border-color:var(--line-2)}
.room.on::before{
  content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;
  background:var(--amber);border-radius:2px;
}
.r-top{display:flex;align-items:center;gap:6px;min-width:0}
.r-code{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.3px}
.r-plat{font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:14px}
.r-dur{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.r-name{font-size:12px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:9.5px;min-width:0}
.r-meta .tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:2px;height:14px;flex:0 0 auto}
.spark i{width:2px;background:var(--jade);opacity:.55;border-radius:1px}
.spark i:nth-child(3n){background:var(--amber);opacity:.7}
.spark.flat i{background:var(--faint);opacity:.35}
.status-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
.status-dot.live{background:var(--jade);box-shadow:0 0 7px rgba(132,214,178,.55)}
.status-dot.attention{background:var(--amber);box-shadow:0 0 7px rgba(230,181,102,.45)}
.status-dot.stopped{background:#4C5865}
.status-dot.starting{background:var(--blue);animation:pulse 1.2s ease-in-out infinite}
.r-status{font-size:9.5px;color:var(--faint);white-space:nowrap}
.r-status.bad{color:var(--amber)}
.side-foot{flex:0 0 auto;padding:8px 12px 10px;border-top:1px solid var(--line)}
.add-btn{
  width:100%;height:34px;border-radius:8px;border:1px dashed #2E3945;
  display:flex;align-items:center;justify-content:center;gap:7px;
  color:var(--muted);font-size:11.5px;
}
.add-btn:hover{border-color:var(--amber-line);color:var(--amber);background:rgba(230,181,102,.04)}
.add-row{padding:8px;border:1px solid var(--amber-line);border-radius:9px;background:rgba(230,181,102,.04);margin:4px 2px 8px}
.add-row input{
  width:100%;height:30px;background:#0A0E12;border:1px solid var(--line-2);border-radius:6px;
  padding:0 8px;font-size:11px;color:var(--ink);
}
.add-row input::placeholder{color:var(--faint)}
.add-row .ar{display:flex;gap:6px;margin-top:6px}
.add-row .ar button{height:26px;padding:0 10px;border-radius:6px;font-size:10.5px;border:1px solid var(--line-2);color:var(--muted)}
.add-row .ar button.primary{background:var(--amber);border-color:var(--amber);color:#1A1306;font-weight:600}
.add-row .ar button:not(.primary):hover{color:var(--ink);border-color:#3A4654}

/* session list */
.session{
  width:100%;text-align:left;padding:9px 10px;border-radius:9px;border:1px solid transparent;
  display:flex;flex-direction:column;gap:3px;margin:1px 0;position:relative;
}
.session:hover{background:#11161D}
.session.on{background:var(--panel-2);border-color:var(--line-2)}
.session.on::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;background:var(--amber);border-radius:2px}
.session .s-name{font-size:11.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session .s-meta{font-size:9.5px;color:var(--faint);display:flex;gap:6px;font-variant-numeric:tabular-nums}
.session .s-badge{font-size:9px;color:var(--jade);border:1px solid rgba(132,214,178,.25);background:var(--jade-soft);border-radius:4px;padding:0 4px;line-height:14px}

/* ------------------------------------------------------------ main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.main::before{
  content:"";position:absolute;inset:0 0 auto;height:240px;pointer-events:none;
  background:radial-gradient(620px 200px at 30% 0,rgba(230,181,102,.035),transparent 70%);
}
.room-head{
  height:60px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 18px;
  border-bottom:1px solid var(--line);position:relative;z-index:2;
}
.rh-left{display:flex;align-items:center;gap:8px;min-width:0}
.rh-left .code{font-family:var(--mono);font-size:10px;color:var(--faint)}
.rh-left h2{font-size:14px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh-left .plat{font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.rh-right{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.timer{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.btn{
  height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);
  color:var(--muted);font-size:11px;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{color:var(--ink);border-color:#3A4654;background:#11161D}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1306;font-weight:600}
.btn.primary:hover{background:#EFC57D;color:#1A1306}
.btn.danger{color:#C99A93;border-color:rgba(232,119,109,.18)}
.btn.danger:hover{border-color:rgba(232,119,109,.5);color:var(--red);background:rgba(232,119,109,.06)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#11161D;border-color:var(--line)}
.btn.sm{height:24px;padding:0 8px;font-size:10.5px}
.stop-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 18px;
  background:rgba(232,119,109,.06);border-bottom:1px solid rgba(232,119,109,.18);
  font-size:11px;color:#D8A39D;position:relative;z-index:2;
}
.stop-bar .spacer{flex:1}
.stage-wrap{flex:1;min-height:0;padding:14px 16px 0;position:relative;z-index:1}
.stage{
  height:100%;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:radial-gradient(720px 420px at 50% 42%,#0E1517 0%,#090D10 62%,#070A0D 100%);
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.55)}
.ov{position:absolute;z-index:2;display:flex;align-items:center;gap:8px;pointer-events:none}
.ov.tl{left:16px;top:14px}
.ov.bl{left:18px;bottom:16px;flex-direction:column;align-items:flex-start;gap:4px;text-shadow:0 2px 14px rgba(0,0,0,.85)}
.ov.tr{right:16px;top:14px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.ov.tr.telemetry{flex-direction:column;align-items:flex-end;gap:3px;line-height:1.5;font-size:9.5px;color:#5E6A77}
.stage-mark{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:118px;font-weight:700;letter-spacing:8px;color:rgba(233,230,223,.022);pointer-events:none;z-index:1}
.live-pill{
  display:flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;
  background:rgba(230,181,102,.14);border:1px solid rgba(230,181,102,.3);
  color:var(--amber);font-size:9px;font-weight:700;letter-spacing:1px;
}
.live-pill i{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:pulse 1.6s infinite}
.ov.tl .desc{font-size:10.5px;color:var(--faint)}
.stage-title{font-size:15px;font-weight:600;letter-spacing:.2px;color:#F2EEE5}
.stage-sub{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.stage-bar{
  height:58px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 17px;
  border-top:1px solid var(--line);margin-top:14px;position:relative;z-index:2;
}
.level{display:flex;align-items:center;gap:8px;min-width:180px}
.meter{width:110px;height:4px;border-radius:4px;background:#1A222B;overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:66%;background:linear-gradient(90deg,var(--jade),var(--amber));border-radius:4px;box-shadow:0 0 10px rgba(230,181,102,.25)}
.level .db{font-family:var(--mono);font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.stage-note{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-bar .spacer{flex:1}

/* page stage */
.page-stage{height:100%;display:flex;flex-direction:column;background:#0A0E12}
.page-banner{
  height:36px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--amber-soft);border-bottom:1px solid var(--amber-line);color:var(--amber);font-size:10.5px;
}
.page-banner .spacer{flex:1}
.page-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;background:#05070A}
.page-video{position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(600px 380px at 50% 45%,#17201E,#080B0D 70%)}
.page-video .ph{position:absolute;left:22px;top:18px;text-align:left;color:#586A64}
.page-video .ph b{display:block;font-size:12px;font-weight:500;color:#7C8F89;margin-bottom:4px}
.page-video .ph span{font-size:10px;color:#44534F}
.page-chat{border-left:1px solid #141C22;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:hidden;background:#080B0E}
.pc-line{font-size:10.5px;color:#80918B;line-height:1.55}
.pc-line b{color:#B7C8C1;font-weight:500;margin-right:5px}
.page-login{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:320px;padding:18px;border-radius:12px;background:#0F141A;border:1px solid #2A3440;
  box-shadow:0 26px 70px rgba(0,0,0,.55);text-align:center;
}
.page-login h3{font-size:13px;margin:0 0 4px}
.page-login p{font-size:10.5px;color:var(--faint);margin:0 0 12px}
.qr{width:104px;height:104px;margin:0 auto 12px;border-radius:8px;background:
  repeating-linear-gradient(0deg,#D8D3C7 0 5px,#0F141A 5px 10px),
  repeating-linear-gradient(90deg,#D8D3C8 0 5px,#0F141A 5px 10px);
  background-blend-mode:screen;border:8px solid #E9E4D8;opacity:.9}
.page-login .note{font-size:9.5px;color:var(--faint);margin-top:8px}

/* attention stage */
.attention{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(560px 360px at 50% 45%,#14120D,#080A0D 72%)}
.att-card{width:460px;text-align:center;padding:26px 28px;border:1px solid #2E2A20;border-radius:14px;background:rgba(18,17,14,.82);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.att-icon{width:42px;height:42px;margin:0 auto 14px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--amber-line);display:flex;align-items:center;justify-content:center;color:var(--amber)}
.att-card h3{font-size:15px;margin:0 0 7px}
.att-card p{font-size:11.5px;line-height:1.8;color:var(--muted);margin:0 auto 18px;max-width:360px}
.att-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.att-note{font-size:10px;color:var(--faint);margin-top:13px}

/* workbench */
.wb-head{height:64px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);position:relative;z-index:2}
.wb-head h2{font-size:14px;margin:0;font-weight:600}
.wb-head .meta{font-size:10.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.wb-head .actions{margin-left:auto;display:flex;gap:6px}
.wb-timeline{flex:0 0 auto;padding:10px 18px 2px;position:relative;z-index:1}
.tl-head{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--faint);margin-bottom:5px}
.tl-head .spacer{flex:1}
.tl-bars{height:46px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line);padding-bottom:1px}
.tl-bars i{flex:1;min-width:1px;background:#2B3942;border-radius:1px 1px 0 0;opacity:.85}
.tl-bars i.hot{background:var(--amber);opacity:.9;box-shadow:0 0 8px rgba(230,181,102,.18)}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:#4F5C69;padding-top:4px}
.wb-filterbar{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:8px 18px;border-bottom:1px solid var(--line);position:relative;z-index:1}
.wb-filterbar .spacer{flex:1}
.wb-filterbar .searchbox{width:190px;height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--line);border-radius:6px;color:var(--faint);background:#0B0F13}
.wb-filterbar .searchbox input{background:none;border:0;color:var(--ink);font-size:10.5px;width:100%}
.wb-filterbar .searchbox input::placeholder{color:var(--faint)}
.wb-list{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 10px;position:relative;z-index:1}
.wline{
  display:grid;grid-template-columns:52px 52px minmax(0,1fr);gap:9px;align-items:start;
  padding:7px 8px;border-radius:7px;border-left:2px solid transparent;
}
.wline:hover{background:#0E1318}

.play-btn{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#1A1306;display:flex;align-items:center;justify-content:center}

.tagline{display:block;margin-top:3px}

.empty-note{padding:26px 18px;text-align:center;color:var(--faint);font-size:11px;line-height:1.9}

/* summary */

.rp-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #161D25}
.rp-row:hover{background:#121820}

.rp-row .code{font-family:var(--mono);font-size:9px;color:var(--faint)}
.rp-row button{width:22px;height:22px;border-radius:5px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.rp-row button:hover{background:#1A222B;color:var(--ink)}
.rp-foot{display:flex;gap:6px;padding:9px 10px;background:#0B0F13}
.rp-foot button{flex:1;height:26px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);font-size:10px}
.rp-foot button:hover{color:var(--ink);border-color:#3A4654}
.rp-foot button.primary{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.palette-scrim{position:fixed;inset:0;background:rgba(4,6,9,.58);backdrop-filter:blur(2px);z-index:90}
.palette{
  position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:560px;z-index:91;
  background:#0F141A;border:1px solid #2C3743;border-radius:12px;overflow:hidden;

.p-input{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}

.p-input input::placeholder{color:var(--faint)}
.p-input kbd{flex:0 0 auto}
.p-list{max-height:360px;overflow-y:auto;padding:5px}
.p-group{font-size:9px;letter-spacing:.7px;color:var(--faint);padding:8px 9px 4px;text-transform:uppercase}
.p-item{

  color:var(--muted);font-size:11.5px;text-align:left;
}
.p-item svg{color:var(--faint)}

.toast{

/* ============================================================
   工具
   ============================================================ */
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function currentRoom(){return rooms.find(r=>r.id===state.room) || rooms[0];}
function currentSession(){return sessions.find(s=>s.id===state.session) || sessions[0];}
function liveCount(){return rooms.filter(r=>r.status==='live'||r.status==='starting').length;}
function roomStatusText(r){
  if(r.status==='live') return r.muted ? '在听 · 已静音' : '在听';
  if(r.status==='attention') return '需要登录';
  if(r.status==='stopped') return '已停止';
  if(r.status==='starting') return '启动中';
  return '';
}
function spark(seed, active){
  let h = '';
  for(let i=0;i<12;i++){
    const v = 18 + Math.abs(Math.sin(seed*1.7 + i*.8))*64 + Math.abs(Math.sin(seed*.5 + i*1.9))*16;
    h += '<i style="height:'+Math.min(96,Math.round(v))+'%"></i>';
  }
  return '<span class="spark'+(active?'':' flat')+'">'+h+'</span>';
}
function roomDot(r){return '<span class="status-dot '+esc(r.status)+'"></span>';}

/* ============================================================
   渲染：外壳
   ============================================================ */
function render(){
  document.body.dataset.view = state.view;
  $('#body').classList.toggle('no-inspector', !state.panel);
  $('#rail').innerHTML = renderRail();
  $('#sidebar').innerHTML = renderSidebar();
  $('#main').innerHTML = renderMain();
  $('#inspector').innerHTML = renderInspector();
  $('#statusbar').innerHTML = renderStatusbar();
  $('#crumb').innerHTML = renderCrumb();
  $('#recCount').textContent = liveCount();
  const stopHint = $('#pStopHint'); if(stopHint) stopHint.textContent = liveCount()+' 路';
  $('#recPop').innerHTML = renderRecPop();
  $('#recPop').hidden = !state.recOpen;
  bindScope();
  if(state.adding){ const el=$('#addInput'); if(el) el.focus(); }
  const body=$('.panel-body'); if(body) body.scrollTop = body.scrollHeight;
  syncPalette();
}

function renderRail(){
  const items = [
    ['listen','收听'], ['workbench','工作台'], ['files','文件'], ['people','人物']
  ];
  return items.map(([v,label])=>{
    const active = state.view===v;
    const badge = v==='listen' && liveCount() ? '<i class="badge">'+liveCount()+'</i>' : '';
    return '<button class="rail-item '+(active?'on':'')+'" data-action="view" data-view="'+v+'" title="'+label+'">'
      + ICONS[v] + '<span>'+label+'</span>' + badge + '</button>';
  }).join('')
  + '<div class="rail-spacer"></div>'
  + '<button class="rail-item '+(state.view==='settings'?'on':'')+'" data-action="view" data-view="settings" title="设置">'
  + ICONS.settings + '<span>设置</span></button>';
}

function renderCrumb(){
  const view = viewMeta[state.view]?.label || '';
  let detail = '';
  if(state.view==='listen') detail = currentRoom().code + ' ' + currentRoom().name;
  if(state.view==='workbench') detail = currentSession().title;
  return '<b>'+view+'</b>'+(detail?'<i>/</i><span>'+esc(detail)+'</span>':'');
}

function renderRecPop(){
  if(!state.recOpen) return '';
  const rows = rooms.filter(r=>r.status==='live'||r.status==='starting').map(r=>
    '<div class="rp-row">'+roomDot(r)
    +'<span class="code">'+r.code+'</span><span class="name">'+esc(r.name)+'</span>'
    +'<button data-action="mute" data-id="'+r.id+'" title="静音">'+(r.muted?ICONS.mute:ICONS.sound)+'</button>'
    +'<button data-action="goto-room" data-id="'+r.id+'" title="打开">'+ICONS.eye+'</button>'
    +'</div>'
  ).join('') || '<div class="empty-note">当前没有正在采集的房间</div>';
  return '<div class="rp-head"><i class="dot pulse" style="background:var(--amber)"></i>正在采集 <b>'+liveCount()+' 路</b><span style="margin-left:auto;color:var(--faint)">上限 5</span></div>'
    + rows
    + '<div class="rp-foot"><button data-action="stop-all">全部停止</button><button class="primary" data-action="view" data-view="listen">打开收听</button></div>';
}

function renderStatusbar(){
  return '<span class="st ok"><i class="dot"></i>引擎正常</span>'
    + '<span class="st">本地服务已连接</span>'
    + '<span class="st">ASR 延迟 0.8s</span>'
    + '<span class="st">已保存</span>'
    + '<span class="spacer"></span>'

    + '<span class="st">v0.1.0</span>';
}

function renderRoomSidebar(){
  const groups = [
    {key:'live', label:'在听', items:rooms.filter(r=>r.status==='live'||r.status==='starting')},
    {key:'attention', label:'需要处理', items:rooms.filter(r=>r.status==='attention')},
    {key:'stopped', label:'已停止', items:rooms.filter(r=>r.status==='stopped')}
  ];
  const list = (state.adding ? renderAddRow() : '')
    + groups.filter(g=>g.items.length).map(g=>
        '<div class="group-label">'+g.label+' <span class="n">'+g.items.length+'</span></div>'
        + g.items.map(r=>renderRoomCard(r)).join('')
      ).join('');
  return '<div class="side-head"><h1>收听</h1><span class="count">'+rooms.length+' 路</span><span class="spacer"></span>'
    + '<button class="icon-btn" data-action="search" title="搜索">'+ICONS.search+'</button>'

    + '<div class="side-list">'+list+'</div>'
    + '<div class="side-foot"><button class="add-btn" data-action="add">'+ICONS.plus+' 添加直播间</button></div>';

function renderRoomCard(r){

function renderStopBar(){
  return '<div class="stop-bar">停止后录音会正常收尾保存，这一路的字幕和场次都会保留。'
    + '<span class="spacer"></span>'

function renderStage(r, mode){
  if(mode==='attention' || (r.status==='attention' && mode!=='page')) return renderAttention(r);
  if(mode==='page') return renderPageStage(r);
  if(r.status==='stopped') return renderStopped(r);
  return '<div class="stage">'
    + '<canvas id="scope"></canvas><div class="vignette"></div>'
    + '<div class="stage-mark">'+r.code+'</div>'
    + '<div class="ov tl"><span class="live-pill"><i></i>LIVE</span><span class="desc">'+esc(r.platform)+' · 网页直播</span></div>'
    + '<div class="ov tr telemetry"><span>音量 -18 dB</span><span>缓冲 24,186 块</span><span>丢块 0</span></div>'
    + '<div class="ov bl"><div class="stage-title">'+r.code+' · '+esc(r.name)+'</div>'
    + '<div class="stage-sub">已入库 · '+r.lines+' 句 · 最近一块 '+r.last+'</div></div>'
    + '</div>';
}

/* ============================================================
   信号画布
   ============================================================ */
let scopeRAF = 0;
function bindScope(){
  cancelAnimationFrame(scopeRAF);
  const c = $('#scope');
  if(!c) return;
  const ctx = c.getContext('2d');
  const draw = (now)=>{
    const rect = c.getBoundingClientRect();
    if(rect.width < 2 || rect.height < 2){ scopeRAF = requestAnimationFrame(draw); return; }
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(rect.width), h = Math.round(rect.height);
    if(c.width !== Math.round(w*dpr) || c.height !== Math.round(h*dpr)){
      c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawScope(ctx, w, h, now/1000);
    scopeRAF = requestAnimationFrame(draw);
  };
  scopeRAF = requestAnimationFrame(draw);
}

function drawScope(ctx, w, h, t){
  ctx.clearRect(0,0,w,h);
  const glow = ctx.createRadialGradient(w*.5,h*.42,10,w*.5,h*.42,w*.55);
  glow.addColorStop(0,'rgba(132,214,178,.06)');
  glow.addColorStop(.5,'rgba(230,181,102,.025)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = 'rgba(233,230,223,.045)';
  ctx.lineWidth = 1;
  for(let x=0;x<w;x+=56){ ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); ctx.stroke(); }
  for(let y=0;y<h;y+=44){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); ctx.stroke(); }

  const mid = h*.43;
  const r = currentRoom();
  const amp = .62 + (r.level||0)*.82;

  function line(color, width, freq, speed, ampK, phase){
    ctx.beginPath();
    for(let x=0;x<=w;x+=1){
      const p = x/w;
      const env = .22 + .78*Math.pow(Math.sin(Math.PI*p), .7);
      const y = mid
        + Math.sin(x*freq + t*speed + phase)*h*.066*amp*ampK*env
        + Math.sin(x*freq*2.6 - t*speed*.8)*h*.026*amp*ampK*env
        + Math.sin(x*.085 + t*2.3)*Math.sin(x*.013 + t*.6)*h*.012*amp*env;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  line('rgba(230,181,102,.78)', 1.4, .012, 1.5, 1.0, 0);
  line('rgba(132,214,178,.42)', 1.0, .019, 1.1, .78, 1.7);

  // spectrum
  const n = 110, bw = w/n;
  for(let i=0;i<n;i++){
    const v = Math.abs(Math.sin(i*.37 + t*1.7))*Math.abs(Math.sin(i*.11 - t*.9));
    const bh = 6 + v*h*.17*(.55 + .45*Math.sin(i*.05 + t*.8));
    const g = ctx.createLinearGradient(0,h-bh-26,0,h-26);
    g.addColorStop(0, i%9===0 ? 'rgba(230,181,102,.55)' : 'rgba(132,214,178,.30)');
    g.addColorStop(1, 'rgba(132,214,178,.02)');
    ctx.fillStyle = g;
    ctx.fillRect(i*bw+bw*.22, h-30-bh, bw*.56, bh);
  }
  ctx.fillStyle = 'rgba(233,230,223,.05)'; ctx.fillRect(0,h-30,w,1);

  // playhead
  const px = w*.83;
  const pg = ctx.createLinearGradient(px-10,0,px+10,0);
  pg.addColorStop(0,'rgba(230,181,102,0)'); pg.addColorStop(.5,'rgba(230,181,102,.55)'); pg.addColorStop(1,'rgba(230,181,102,0)');
  ctx.fillStyle = pg; ctx.fillRect(px-10, h*.14, 20, h*.62);
  ctx.fillStyle = 'rgba(230,181,102,.9)'; ctx.fillRect(px, h*.14, 1, h*.62);
}

/* ============================================================
   命令面板
   ============================================================ */
function openPalette(){
  $('#palette').hidden = false;
  $('#paletteScrim').hidden = false;
  const input = $('#pInput');
  input.value = '';
  $$('.p-item').forEach(x=>{x.hidden=false; x.classList.remove('sel');});
  syncPalette();
  setTimeout(()=>input.focus(), 10);
}
function closePalette(){
  $('#palette').hidden = true;
  $('#paletteScrim').hidden = true;
}
function syncPalette(){
  if($('#palette').hidden) return;
  const items = $$('.p-item').filter(x=>!x.hidden);
  items.forEach((x,i)=>x.classList.toggle('sel', i===0));
}
function filterPalette(q){
  q = (q||'').trim().toLowerCase();
  $$('.p-item').forEach(x=>{
    x.hidden = !!q && !x.textContent.toLowerCase().includes(q);
  });
  syncPalette();
}
function paletteKey(e){
  if(e.key==='Escape'){ closePalette(); return; }
  const items = $$('.p-item').filter(x=>!x.hidden);
  if(!items.length) return;
  let idx = items.findIndex(x=>x.classList.contains('sel'));
  if(idx < 0) idx = 0;
  if(e.key==='ArrowDown'){ e.preventDefault(); items[idx].classList.remove('sel'); items[(idx+1)%items.length].classList.add('sel'); }
  if(e.key==='ArrowUp'){ e.preventDefault(); items[idx].classList.remove('sel'); items[(idx-1+items.length)%items.length].classList.add('sel'); }
  if(e.key==='Enter'){ e.preventDefault(); items[idx].click(); }
}

/* ============================================================
   动作
   ============================================================ */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2300);
}

function switchView(v){
  state.view = v;
  state.recOpen = false;
  if(v==='listen' && !rooms.find(r=>r.id===state.room)) state.room = rooms[0].id;
  state.stageMode = '';
  render();
}

function selectRoom(id){
  state.room = id;
  const r = currentRoom();
  state.stageMode = r.status==='attention' ? 'attention' : 'signal';
  state.confirmStop = '';
  state.recOpen = false;
  if(state.view!=='listen') state.view = 'listen';
  render();
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(el.closest('.palette')) closePalette();

  if(a==='view'){ switchView(el.dataset.view); return; }
  if(a==='palette'){ openPalette(); return; }
  if(a==='palette-close'){ closePalette(); return; }
  if(a==='palette-add'){ closePalette(); switchView('listen'); state.adding = true; render(); return; }
  if(a==='rec'){ state.recOpen = !state.recOpen; render(); return; }
  if(a==='room'){ selectRoom(el.dataset.id); return; }
  if(a==='goto-room'){ state.recOpen=false; selectRoom(el.dataset.id); return; }
  if(a==='mute'){
    const r = rooms.find(x=>x.id===el.dataset.id); if(!r) return;
    r.muted = !r.muted;
    toast(r.muted ? '已静音扬声器，采集继续' : '已恢复声音');
    render(); return;
  }
  if(a==='stop'){ state.confirmStop = el.dataset.id; render(); return; }
  if(a==='stop-cancel'){ state.confirmStop=''; render(); return; }
  if(a==='stop-confirm'){
    const r = currentRoom(); r.status='stopped'; r.level=0; r.last='刚刚'; state.confirmStop='';
    state.stageMode='signal'; toast('已停止，录音会收尾保存'); render(); return;
  }
  if(a==='add'){ switchView('listen'); state.adding = true; render(); return; }
  if(a==='add-cancel'){ state.adding=false; render(); return; }
  if(a==='add-submit'){ addRoom(); return; }
  if(a==='show-page'){ state.stageMode='page'; render(); return; }
  if(a==='hide-page'){ state.stageMode='signal'; render(); return; }
  if(a==='login-done'){
    const r = currentRoom(); r.status='live'; r.level=.55; r.lines=1; r.last='0.6s 前';
    state.stageMode='signal'; toast('登录完成，已恢复采集'); render(); return;
  }
  if(a==='retry'){
    const r = rooms.find(x=>x.id===el.dataset.id) || currentRoom();
    r.status='starting'; render();
    setTimeout(()=>{ r.status='live'; r.level=.5; r.lines=1; r.last='0.9s 前'; render(); toast('已恢复采集'); }, 1300);
    return;
  }
  if(a==='switch-capture'){
    const r = rooms.find(x=>x.id===el.dataset.id) || currentRoom();
    r.status='starting'; render();
    setTimeout(()=>{ r.status='live'; r.level=.42; r.lines=1; r.last='1.0s 前'; render(); toast('已切换浏览器采集'); }, 1500);
    return;
  }
  if(a==='stop-all'){
    rooms.forEach(r=>{ if(r.status==='live'||r.status==='starting'){ r.status='stopped'; r.level=0; } });
    state.recOpen=false; state.stageMode='signal'; toast('已停止全部采集'); render(); return;
  }
  if(a==='toggle-panel'){ state.panel = !state.panel; render(); return; }
  if(a==='lfilter'){ state.filter = el.dataset.f; render(); return; }
  if(a==='sumtab'){ state.sumTab = el.dataset.tab; render(); return; }
  if(a==='session'){ state.session = el.dataset.id; if(state.view==='files'){ state.view='workbench'; } render(); return; }
  if(a==='person'){ state.person = el.dataset.name; state.view='people'; render(); return; }
  if(a==='setting-toggle'){ const k=el.dataset.key; state.settings[k]=!state.settings[k]; render(); return; }
  if(a==='search'){ toast('搜索：原型暂未接入'); return; }
  if(a==='import'){ toast('导入录音（原型）'); return; }
  if(a==='toast'){ toast(el.dataset.msg || '完成'); return; }
});

function addRoom(){
  const input = $('#addInput');
  if(!input) return;
  const raw = input.value.trim();
  if(!raw){ input.focus(); return; }
  let title = raw, platform = '网页';
  try{
    const u = new URL(raw);
    const host = u.hostname.replace(/^www\./,'');
    if(host.includes('douyin')) platform = '抖音';
    else if(host.includes('kuaishou')) platform = '快手';
    else if(host.includes('bilibili')) platform = 'B 站';
    title = host + (u.pathname && u.pathname !== '/' ? u.pathname : '');
  }catch(e){ title = raw.slice(0, 28); }
  const n = rooms.length + 1;
  const id = 'ch' + Date.now();
  rooms.unshift({
    id, code:'CH'+String(n).padStart(2,'0'), name:title, platform,
    status:'starting', duration:'00:00:00', level:.15, muted:false, session:'', lines:0, last:'', keywords:[]
  });
  state.room = id; state.stageMode='signal'; state.adding=false; render();
  toast('正在解析直播间…');
  setTimeout(()=>{
    const r = rooms.find(x=>x.id===id);
    if(!r) return;
    r.status='live'; r.duration='00:00:12'; r.level=.58; r.last='0.7s 前';
    if(!transcripts[id]) transcripts[id] = [
      {t:'00:02', who:'主播', cls:'host', text:'欢迎来到直播间，先把今天的岗位说一下。', tag:''},
      {t:'00:08', who:'观众', cls:'viewer', text:'在哪个城市？', tag:''}
    ];
    r.lines = 2;
    render(); toast('已开始收听');
  }, 1700);
}

/* 键盘 */
document.addEventListener('keydown', (e)=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#palette').hidden ? openPalette() : closePalette(); return; }
  if(e.key==='Escape'){
    if(!$('#palette').hidden) closePalette();
    else if(state.recOpen){ state.recOpen=false; render(); }
    else if(state.confirmStop){ state.confirmStop=''; render(); }
    return;
  }
  if(typing) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='l'){ e.preventDefault(); switchView('listen'); state.adding=true; render(); return; }
  if((e.ctrlKey || e.metaKey) && ['1','2','3','4'].includes(e.key)){
    e.preventDefault();
    const map={'1':'listen','2':'workbench','3':'files','4':'people'};
    switchView(map[e.key]); return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    if(state.view!=='listen') return;
    e.preventDefault();
    const list = rooms.filter(r=>r.status!=='stopped').concat(rooms.filter(r=>r.status==='stopped'));
    const idx = Math.max(0, list.findIndex(r=>r.id===state.room));
    const next = e.key==='ArrowDown' ? Math.min(list.length-1, idx+1) : Math.max(0, idx-1);
    selectRoom(list[next].id);
    return;
  }
  if(e.key==='m'){
    const r=currentRoom(); if(r.status==='live'){ r.muted=!r.muted; toast(r.muted?'已静音':'已恢复声音'); render(); }
  }
});

$('#pInput')?.addEventListener('input', (e)=>filterPalette(e.target.value));
$('#pInput')?.addEventListener('keydown', paletteKey);
document.addEventListener('keydown', (e)=>{
  if(e.target && e.target.id==='addInput' && e.key==='Enter'){ e.preventDefault(); addRoom(); }
});

/* 启动 */
if(state.stageMode==='') state.stageMode = currentRoom().status==='attention' ? 'attention' : 'signal';
if(state.adding && state.view!=='listen') state.view='listen';
render();
if(params.get('palette')==='1') openPalette();
setTimeout(()=>{ const el=$('#addInput'); if(el) el.focus(); }, 60);
</script>
