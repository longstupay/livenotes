<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行指标 · LiveNotes</title>
<style>
:root{
  --bg:#0b1417; --panel:#111e23; --panel-2:#0e191d; --panel-3:#15262c;
  --line:#22343a; --line-2:#2d444c; --paper:#e9e4d8; --muted:#8b9b99; --dim:#61736f;
  --jade:#7fc9a6; --jade-2:#4da987; --amber:#e8b45a; --red:#e06c5f; --blue:#88a9c9;
  --sans:"Bahnschrift","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;
  padding:14px 22px;background:rgba(11,20,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:600;letter-spacing:.04em;margin:0;white-space:nowrap}
header .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
header .spacer{flex:1}
header .live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade-2)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}
button{font:inherit;color:var(--paper);background:var(--panel-3);border:1px solid var(--line-2);
  border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--jade-2)}
main{max-width:1440px;margin:0 auto;padding:18px 22px 48px}
.banner{display:none;margin-bottom:14px;padding:10px 14px;border:1px solid var(--red);
  border-radius:6px;background:rgba(224,108,95,.09);color:var(--red);font-size:13px}
.banner.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.kpi .k{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.kpi .v{font-family:var(--mono);font-size:25px;line-height:1.25;margin-top:5px;color:var(--paper)}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
.kpi.hot .v{color:var(--red)}
.kpi.warm .v{color:var(--amber)}
.kpi.good .v{color:var(--jade)}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:24px 0 9px;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.9fr);gap:14px}
@media (max-width:1080px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:10px;padding:9px 13px;
  border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.panel .ph .spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(34,52,58,.6);white-space:nowrap}
th{color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
tbody tr:hover{background:rgba(127,201,166,.045)}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.title{max-width:260px;overflow:hidden;text-overflow:ellipsis}
td .id{display:block;color:var(--dim);font-family:var(--mono);font-size:10.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;
  font-family:var(--mono);border:1px solid var(--line-2);color:var(--muted)}
.badge.run{color:var(--jade);border-color:var(--jade-2)}
.badge.pause{color:var(--amber);border-color:var(--amber)}
.badge.stall{color:var(--red);border-color:var(--red);background:rgba(224,108,95,.12)}
.badge.stop{color:var(--dim)}
.empty{padding:22px 14px;color:var(--dim);font-size:12.5px;text-align:center}
.events{max-height:420px;overflow:auto}
.ev{padding:9px 13px;border-bottom:1px solid rgba(34,52,58,.55);font-size:12px}
.ev .top{display:flex;gap:8px;align-items:baseline}
.ev .ts{color:var(--dim);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.ev .name{font-family:var(--mono);font-size:11.5px;color:var(--blue);overflow:hidden;text-overflow:ellipsis}
.ev.warn .name{color:var(--amber)} .ev.error .name{color:var(--red)}
.ev .fl{color:var(--muted);font-size:11px;margin-top:3px;word-break:break-all}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.chartbox{position:relative;height:190px;padding:8px 6px 22px}
canvas{width:100%;height:100%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;padding:0 13px 8px}
.legend i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.counters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0}
.ctr{padding:8px 13px;border-bottom:1px solid rgba(34,52,58,.5);display:flex;
  justify-content:space-between;gap:10px;font-size:12px}
.ctr .n{color:var(--muted);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.ctr .v{font-family:var(--mono);color:var(--paper);white-space:nowrap}
footer{color:var(--dim);font-size:11px;margin-top:22px;display:flex;gap:16px;flex-wrap:wrap}
footer code{font-family:var(--mono)}
</style>
</head>
<body>
<script src="/static/js/embed.js"></script>
<header data-ln-region="topbar">
  <h1>运行指标</h1>
  <span class="sub" id="clock">—</span>
  <span class="spacer"></span>
  <span class="live"><span class="dot" id="dot"></span><span id="conn">连接中…</span></span>
  <button id="toggle" title="暂停/继续轮询">暂停</button>
  <a href="/rooms">← 收听页</a>
</header>

<main data-ln-region="stage">
  <div class="banner" id="banner"></div>

  <section class="kpis" id="kpis"></section>

  <h2>链路</h2>
  <div class="charts">
    <div class="panel">
      <div class="ph"><span>ASR 队列深度</span><span class="spacer"></span>
        <span id="q-now" class="sub">—</span></div>
      <div class="chartbox"><canvas id="chart-queue"></canvas></div>
    </div>
    <div class="panel">
      <div class="ph"><span>每采样周期：定稿 / 丢块</span><span class="spacer"></span>
        <span id="d-now" class="sub">—</span></div>
      <div class="legend">
        <span><i style="background:#7fc9a6"></i>新定稿</span>
        <span><i style="background:#e06c5f"></i>PCM 丢块</span>
      </div>
      <div class="chartbox"><canvas id="chart-flow"></canvas></div>
    </div>
  </div>

  <div class="layout" style="margin-top:14px">
    <div class="panel">
      <div class="ph"><span>场次</span><span class="spacer"></span>
        <span id="sess-count" class="sub">—</span></div>
      <div style="overflow:auto">
        <table>
          <thead><tr>
            <th>场次</th><th class="num">时长</th><th class="num">收块</th>
            <th class="num">丢块</th><th class="num">定稿</th><th class="num">丢句</th>
            <th class="num">RTF</th><th class="num">定稿 P95</th><th class="num">推送</th>
            <th class="num">错误</th><th class="num">最后一句</th><th>状态</th>
          </tr></thead>
          <tbody id="sessions"><tr><td colspan="12" class="empty">等待数据…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="ph"><span>最近事件</span><span class="spacer"></span>
        <a href="/api/metrics/events?limit=200" target="_blank">JSON</a></div>
      <div class="events" id="events"><div class="empty">暂无事件</div></div>
    </div>
  </div>

  <h2>全局计数</h2>
  <div class="panel"><div class="counters" id="counters">
    <div class="empty">等待数据…</div>
  </div></div>

  <footer>
    <span>JSON：<code>/api/metrics</code></span>
    <span>时序：<code>/api/metrics?since=&lt;ISO&gt;</code></span>
    <span>Prometheus：<code>/api/metrics?format=prometheus</code></span>
    <span>日志：<code>data/logs/app-YYYYMMDD.jsonl</code></span>
  </footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ESC = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NUM = (n, d) => (n == null || isNaN(n)) ? "—"
  : Number(n).toLocaleString("zh-CN", {maximumFractionDigits: d == null ? 0 : d});
const MS = (n) => (n == null || isNaN(n) || n <= 0) ? "—"
  : (n >= 1000 ? (n / 1000).toFixed(2) + "s" : Math.round(n) + "ms");
const SECS = (n) => (n == null || isNaN(n)) ? "—" : {
  s: Math.round(n) + "s", m: (n / 60).toFixed(1) + "m", h: (n / 3600).toFixed(1) + "h"
}[n >= 3600 ? "h" : n >= 60 ? "m" : "s"];
const get = (o, path, def) => {
  let cur = o;
  for (const k of path.split(".")) {
    if (cur == null || typeof cur !== "object" || !(k in cur)) return def;
    cur = cur[k];
  }
  return cur === undefined ? def : cur;
};
const pct = (a, b) => (!b ? "—" : (a / b * 100).toFixed(2) + "%");

let timer = null, seriesTimer = null, paused = false, series = [], history = [];
let lastGlobal = null;

function ago(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso);
  if (!isFinite(t)) return "—";
  const s = Math.max(0, (Date.now() - t) / 1000);
  return s < 60 ? Math.round(s) + "s前" : s < 3600
    ? Math.round(s / 60) + "m前" : (s / 3600).toFixed(1) + "h前";
}

function badge(s) {
  if (s.stall) return '<span class="badge stall">停滞</span>';
  if (s.state !== "running") return '<span class="badge stop">已结束</span>';
  if (s.paused) return '<span class="badge pause">暂停</span>';
  return '<span class="badge run">运行中</span>';
}

function renderKpis(s) {
  const asr = get(s, "live.asr", {});
  const db = s.db || {}, tok = db.tokens || {}, push = db.pushes || {};
  const sessions = get(s, "live.sessions", []);
  const active = sessions.filter((x) => x.running).length;
  const stalled = sessions.filter((x) => x.stall).length;
  const submitted = asr.submitted_finals || 0;
  const dropped = asr.dropped_finals || 0;
  const finalP95 = get(asr, "final_latency.p95", 0);
  const queue = (asr.pending_finals || 0) + (asr.pending_partials || 0);
  const cards = [
    {k: "在跑场次", v: active, s: stalled ? stalled + " 场停滞" : "全部正常",
     cls: stalled ? "hot" : "good"},
    {k: "ASR 排队", v: NUM(queue), s: "定稿 " + NUM(asr.pending_finals || 0)
      + " · 临时 " + NUM(asr.pending_partials || 0),
     cls: queue > 20 ? "hot" : queue > 6 ? "warm" : ""},
    {k: "定稿 P95", v: MS(finalP95), s: "RTF " + (asr.rtf == null ? "—" : Number(asr.rtf).toFixed(3)),
     cls: finalP95 > 3000 ? "hot" : finalP95 > 1500 ? "warm" : "good"},
    {k: "定稿丢句率", v: pct(dropped, submitted), s: NUM(dropped) + " / " + NUM(submitted),
     cls: submitted && dropped / submitted > 0.02 ? "hot" : ""},
    {k: "今日 token", v: NUM(tok.total), s: "调用 " + NUM(tok.calls)
      + (tok.cost_usd ? " · ≈" + Number(tok.cost_usd).toFixed(4) : ""),
     cls: ""},
    {k: "今日推送", v: NUM(push.sent || 0), s: "失败 " + NUM(push.failed || 0)
      + " · 跳过 " + NUM(push.skipped || 0), cls: push.failed > 0 ? "warm" : ""},
    {k: "HTTP 错误", v: NUM(get(s, "global.counters.http.errors", 0)),
     s: "请求 " + NUM(get(s, "global.counters.http.requests", 0)), cls: ""},
    {k: "运行时长", v: SECS(s.uptime_s), s: "PID " + (s.pid || "—")
      + " · " + (s.threads || 0) + " 线程", cls: ""},
  ];
  $("kpis").innerHTML = cards.map((c) =>
    '<div class="kpi ' + (c.cls || "") + '"><div class="k">' + ESC(c.k)
    + '</div><div class="v">' + ESC(c.v) + '</div><div class="s">' + ESC(c.s)
    + '</div></div>').join("");
}

function renderSessions(s) {
  const liveRows = get(s, "live.sessions", []);
  const ids = new Set(liveRows.map((x) => x.id));
  const ended = history.filter((h) => !ids.has(h.session_id)).map((h) => ({
    ...(h.data || {}), id: h.session_id, title: (h.data || {}).title || h.session_id,
    state: "stopped", running: false, started_at: h.started_at,
    finished_at: h.finished_at
  }));
  const rows = liveRows.concat(ended);
  const active = liveRows.filter((x) => x.running).length;
  $("sess-count").textContent = active + " 在跑 / " + liveRows.length + " 当前 · "
    + ended.length + " 历史";
  if (!rows.length) {
    $("sessions").innerHTML = '<tr><td colspan="12" class="empty">当前没有监听场次</td></tr>';
    return;
  }
  $("sessions").innerHTML = rows.map((x) => {
    const c = get(x, "metrics.counters", {});
    const a = x.asr || {};
    const errors = (a.errors || 0) + (c["live.errors"] || 0);
    const finalP95 = get(a, "final_latency.p95", 0);
    const chunks = c["live.chunks_in"] || 0;
    const drops = c["live.chunks_dropped"] || 0;
    const pushed = c["push.sent"] || 0;
    return '<tr>'
      + '<td class="title" title="' + ESC(x.title) + '">' + ESC(x.title || x.id)
      + '<span class="id">' + ESC(x.id) + '</span></td>'
      + '<td class="num">' + ESC(SECS(x.elapsed)) + '</td>'
      + '<td class="num">' + NUM(chunks) + '</td>'
      + '<td class="num" title="' + ESC(pct(drops, chunks)) + '">' + NUM(drops) + '</td>'
      + '<td class="num">' + NUM(a.decoded_finals || x.n_utterances || 0) + '</td>'
      + '<td class="num">' + NUM(a.dropped_finals || 0) + '</td>'
      + '<td class="num">' + (a.rtf == null ? "—" : Number(a.rtf).toFixed(3)) + '</td>'
      + '<td class="num">' + ESC(MS(finalP95)) + '</td>'
      + '<td class="num">' + NUM(pushed) + '</td>'
      + '<td class="num">' + NUM(errors) + '</td>'
      + '<td class="num">' + (x.running ? ESC(SECS(x.last_final_age_s)) : "—") + '</td>'
      + '<td>' + badge(x) + '</td></tr>';
  }).join("");
}

function renderEvents(s) {
  const evs = s.events || [];
  if (!evs.length) { $("events").innerHTML = '<div class="empty">暂无事件</div>'; return; }
  $("events").innerHTML = evs.map((e) => {
    const f = e.fields || {};
    const keys = Object.keys(f).slice(0, 4);
    const fl = keys.map((k) => ESC(k) + "=" + ESC(f[k])).join(" · ");
    return '<div class="ev ' + ESC(e.level || "") + '"><div class="top">'
      + '<span class="ts">' + ESC((e.ts || "").slice(5, 19).replace("T", " ")) + '</span>'
      + '<span class="name">' + ESC(e.event) + '</span></div>'
      + (e.session_id ? '<div class="fl">' + ESC(e.session_id) + '</div>' : '')
      + (fl ? '<div class="fl">' + fl + '</div>' : '') + '</div>';
  }).join("");
}

function renderCounters(s) {
  const counters = get(s, "global.counters", {});
  const gauges = get(s, "global.gauges", {});
  const windows = get(s, "global.windows", {});
  const items = [];
  for (const [k, v] of Object.entries(counters)) items.push([k, NUM(v, 2)]);
  for (const [k, v] of Object.entries(gauges)) items.push([k, NUM(v, 2)]);
  for (const [k, w] of Object.entries(windows)) {
    items.push([k + " · p95", MS(w.p95)]);
  }
  if (!items.length) { $("counters").innerHTML = '<div class="empty">暂无计数</div>'; return; }
  $("counters").innerHTML = items.sort((a, b) => a[0].localeCompare(b[0]))
    .map(([k, v]) => '<div class="ctr"><span class="n" title="' + ESC(k) + '">'
      + ESC(k) + '</span><span class="v">' + ESC(v) + '</span></div>').join("");
}

function prepCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 160;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return {ctx, w, h};
}

function axes(ctx, w, h, max, n) {
  ctx.strokeStyle = "rgba(139,155,153,.18)";
  ctx.fillStyle = "rgba(139,155,153,.7)";
  ctx.lineWidth = 1; ctx.font = "10px Consolas,monospace";
  for (let i = 0; i <= 4; i++) {
    const y = 8 + (h - 30) * i / 4;
    ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(w - 8, y); ctx.stroke();
    const val = max * (4 - i) / 4;
    ctx.fillText(max < 10 ? val.toFixed(1).replace(/\.0$/, "") : String(Math.round(val)),
      4, y + 3);
  }
  ctx.fillText(n ? n + " 个采样" : "暂无采样", 38, h - 4);
}

function line(ctx, pts, w, h, max, color, fill) {
  if (pts.length < 2) return;
  const x0 = 34, x1 = w - 8, y0 = 8, y1 = h - 22;
  const px = (i) => x0 + (x1 - x0) * i / (pts.length - 1);
  const py = (v) => y1 - (y1 - y0) * Math.min(1, (v || 0) / (max || 1));
  ctx.beginPath();
  pts.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.lineJoin = "round"; ctx.stroke();
  if (fill) {
    ctx.lineTo(px(pts.length - 1), y1); ctx.lineTo(px(0), y1); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  }
}

function drawQueue(rows) {
  const cv = $("chart-queue"), {ctx, w, h} = prepCanvas(cv);
  const vals = rows.map((r) => Number(get(r.data, "live.asr.pending_finals", 0)) || 0);
  const max = Math.max(4, ...vals);
  axes(ctx, w, h, max, rows.length);
  line(ctx, vals, w, h, max, "#7fc9a6", "rgba(127,201,166,.12)");
  $("q-now").textContent = vals.length ? "当前 " + vals[vals.length - 1] : "—";
}

function drawFlow(rows) {
  const cv = $("chart-flow"), {ctx, w, h} = prepCanvas(cv);
  let prevF = null, prevD = null;
  const finals = [], drops = [];
  for (const r of rows) {
    const f = Number(get(r.data, "global.counters.live.finals", 0)) || 0;
    const d = Number(get(r.data, "global.counters.live.chunks_dropped", 0)) || 0;
    finals.push(prevF == null ? 0 : Math.max(0, f - prevF));
    drops.push(prevD == null ? 0 : Math.max(0, d - prevD));
    prevF = f; prevD = d;
  }
  const max = Math.max(2, ...finals, ...drops);
  axes(ctx, w, h, max, rows.length);
  line(ctx, drops, w, h, max, "#e06c5f", "rgba(224,108,95,.10)");
  line(ctx, finals, w, h, max, "#7fc9a6", "rgba(127,201,166,.10)");
  $("d-now").textContent = rows.length
    ? "本周期 定稿 " + finals[finals.length - 1] + " · 丢块 " + drops[drops.length - 1] : "—";
}

function renderAll(s) {
  lastGlobal = s;
  renderKpis(s); renderSessions(s); renderEvents(s); renderCounters(s);
  if (series.length) { drawQueue(series); drawFlow(series); }
  $("clock").textContent = "更新于 " + (s.ts || "").slice(11, 19);
  $("dot").className = "dot" + (s.live_error ? " warn" : "");
  $("conn").textContent = s.live_error ? "指标部分不可用" : "实时";
}

async function fetchJson(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function poll() {
  try {
    const s = await fetchJson("/api/metrics");
    $("banner").classList.remove("on");
    renderAll(s);
  } catch (e) {
    $("dot").className = "dot off";
    $("conn").textContent = "连接失败";
    const b = $("banner");
    b.classList.add("on");
    b.textContent = "取指标失败：" + e.message + "。服务是否还在运行？";
  }
}

async function pollSeries() {
  try {
    const since = new Date(Date.now() - 3600 * 1000).toISOString().slice(0, 19);
    const [s, h] = await Promise.all([
      fetchJson("/api/metrics?since=" + encodeURIComponent(since)
        + "&scope=global&limit=600"),
      fetchJson("/api/metrics/sessions?limit=30"),
    ]);
    series = s.series || [];
    history = h.sessions || [];
    if (lastGlobal) {
      drawQueue(series); drawFlow(series); renderSessions(lastGlobal);
    }
  } catch (e) { /* 主轮询会显示连接状态 */ }
}

function start() {
  if (timer) return;
  timer = setInterval(poll, 2000);
  seriesTimer = setInterval(pollSeries, 10000);
  poll(); pollSeries();
}
function stop() {
  clearInterval(timer); clearInterval(seriesTimer); timer = null; seriesTimer = null;
}
$("toggle").onclick = () => {
  paused = !paused;
  $("toggle").textContent = paused ? "继续" : "暂停";
  $("dot").className = "dot" + (paused ? " warn" : "");
  $("conn").textContent = paused ? "已暂停" : "实时";
  paused ? stop() : start();
};
window.addEventListener("resize", () => {
  if (series.length) { drawQueue(series); drawFlow(series); }
});
start();
</script>
</body>
</html>
