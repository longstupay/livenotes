name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node (前端拆成 ESM 模块，语法检查要它)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        # 故意只装 requirements-dev.txt（不含 sherpa-onnx）：
        # 「不装实时依赖也能启动、也能跑完整测试」是验收项之一。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run regression suite
        run: python -m pytest
      - name: Web layering (base vs desktop skin)
        # 基座里不许出现桌面实现、皮肤只许用锚点；规则见 docs/29
        run: python tools/check_web_layers.py
      - name: Server imports without live dependencies
        run: python -c "import app.server; print('app.server import ok')"

  extension:
    name: extension selftest (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run offscreen selftest
        run: node extensions/livehub/selftest.mjs
